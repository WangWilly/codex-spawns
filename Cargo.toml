[package]
name = "codex-spawns"
version = "0.2.0"
edition = "2021"
description = "Inspect Codex root conversations and spawned agent sessions"
license = "MIT"

[lib]
name = "codex_spawns"

[dependencies]
blake3 = "1.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
