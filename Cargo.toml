[package]
name = "codex-spawns"
version = "0.3.0"
edition = "2021"
description = "Inspect Codex root conversations and spawned agent sessions"
license = "MIT"

[workspace]
members = ["xtask"]
resolver = "2"

[lib]
name = "codex_spawns"

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ratatui = "0.29"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bench]]
name = "index_query"
harness = false
