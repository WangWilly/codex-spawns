name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  detect-release-changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: paths
        name: Detect release-related paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -z "$BASE_SHA" || test "$BASE_SHA" = "0000000000000000000000000000000000000000"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- 'src/**' Cargo.toml Cargo.lock rust-toolchain.toml LICENSE .cargo/config.toml install.sh scripts/package-release.sh scripts/render-installer.sh '.github/actions/**' '.github/workflows/**'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  release-builds:
    needs: [checks, detect-release-changes]
    if: needs.detect-release-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            build_command: cargo build
          - os: macos-15-intel
            target: x86_64-apple-darwin
            build_command: cargo build
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            build_command: cargo zigbuild
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            build_command: cargo zigbuild
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: package
        name: Read package version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Build, verify, package, and upload target
        uses: ./.github/actions/build-release
        with:
          target: ${{ matrix.target }}
          build-command: ${{ matrix.build_command }}
          version: ${{ steps.package.outputs.version }}
