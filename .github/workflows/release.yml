name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: version
        name: Require tag and Cargo version to match
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if test "$TAG" != "v$version"; then
            echo "tag/version mismatch: tag=$TAG Cargo.toml=$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            build_command: cargo build
          - os: macos-15-intel
            target: x86_64-apple-darwin
            build_command: cargo build
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            build_command: cargo zigbuild
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            build_command: cargo zigbuild
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build, verify, package, and upload target
        uses: ./.github/actions/build-release
        with:
          target: ${{ matrix.target }}
          build-command: ${{ matrix.build_command }}
          version: ${{ needs.validate.outputs.version }}

  draft-release:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download packaged targets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: codex-spawns-*
          path: dist
          merge-multiple: true
      - name: Create aggregate checksums
        working-directory: dist
        run: sha256sum codex-spawns-*.tar.gz > SHA256SUMS
      - name: Add version-bound installer
        run: scripts/render-installer.sh "${{ github.ref_name }}" install.sh dist/install.sh
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/codex-spawns-*.tar.gz dist/SHA256SUMS dist/install.sh \
            --draft --generate-notes --verify-tag \
            --title "codex-spawns ${{ github.ref_name }}"
